name: CI

on:
  pull_request:
    branches: [master]

jobs:
  config-test:
    name: Configuration and Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and auth defaults
        run: |
          for script in build/bin/docker-startup.sh example/mysql-init.sh test/*.sh; do
            bash -n "$script"
          done
          bash test/auth-defaults.sh
          bash test/mysql-init.sh
          python3 -m py_compile test/docker-smoke.py
          for example in example/*.yaml; do
            docker compose --env-file example/.env -f "$example" config --quiet
          done

  build-test:
    name: Build Image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: standard
            file: build/Dockerfile
          - name: slim
            file: build/Dockerfile.Slim
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: build
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          load: false

  smoke-test:
    name: Smoke Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            file: build/Dockerfile
            test-args: --mysql
          - name: slim
            file: build/Dockerfile.Slim
            test-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: build
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: nacos-smoke:test
      - name: Prepare release-matched MySQL schema
        if: matrix.name == 'standard'
        run: bash example/mysql-init.sh
      - name: Test startup, auth and persisted plugin configuration
        run: python3 test/docker-smoke.py --image nacos-smoke:test ${{ matrix.test-args }}
