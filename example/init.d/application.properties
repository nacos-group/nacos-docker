# Nacos 3.3 custom MySQL configuration. Keep secrets in the container environment.
nacos.server.main.port=8848
nacos.server.contextPath=/nacos
nacos.console.port=8080
nacos.console.contextPath=
nacos.console.ui.default=next
nacos.console.remote.server.context-path=/nacos

nacos.plugin.datasource-dialect.type=mysql
nacos.plugin.datasource.db.num=1
nacos.plugin.datasource.db.url.0=jdbc:mysql://mysql:3306/nacos_devtest?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&useSSL=false&allowPublicKeyRetrieval=true
nacos.plugin.datasource.db.user.0=${MYSQL_SERVICE_USER:nacos}
nacos.plugin.datasource.db.password.0=${MYSQL_SERVICE_PASSWORD:nacos}
nacos.plugin.datasource.db.pool.config.connection-timeout=30000

nacos.core.auth.enabled=true
nacos.core.auth.admin.enabled=true
nacos.core.auth.console.enabled=true
nacos.core.auth.server.identity.key=${NACOS_AUTH_IDENTITY_KEY:}
nacos.core.auth.server.identity.value=${NACOS_AUTH_IDENTITY_VALUE:}
nacos.plugin.auth.type=${NACOS_AUTH_SYSTEM_TYPE:nacos}
nacos.plugin.auth.nacos.token.secret.key=${NACOS_AUTH_TOKEN:}
nacos.plugin.auth.nacos.token.expire.seconds=${NACOS_AUTH_TOKEN_EXPIRE_SECONDS:18000}
nacos.plugin.auth.nacos.caching.enabled=${NACOS_AUTH_CACHE_ENABLE:false}

nacos.plugin.ai-pipeline.enabled=${NACOS_AI_PIPELINE_ENABLED:true}
nacos.plugin.ai-pipeline.skill-scanner.enabled=${NACOS_AI_PIPELINE_SKILL_SCANNER_ENABLED:true}
nacos.plugin.ai-pipeline.skill-spector.enabled=false
