# Runtime configuration of the Native Server image (build/Dockerfile.Native), copied to
# conf/application.properties. The Native executable fixes the datasource, the standalone or cluster
# choice, the deployment and the function mode when it is built, and docker-native-startup.sh refuses
# environment values that disagree with them. The Native archive contains the default auth plugin and
# the MySQL and PostgreSQL datasource plugins only, and no AI plugin; see the AI section below.

#*************** Nacos port Related Configurations ***************#
### Nacos Server Main port
nacos.server.main.port=${NACOS_APPLICATION_PORT:8848}

#*************** Datasource Related Configurations ***************#
### The datasource of the executable comes from the archive, and the entrypoint sets SPRING_DATASOURCE_PLATFORM to it.
### The URL below is MySQL, filled from the MYSQL_SERVICE_* variables. For PostgreSQL, mount a
### conf/application.properties with the canonical PostgreSQL datasource lines (see the README).
nacos.plugin.datasource-dialect.type=${SPRING_DATASOURCE_PLATFORM:}
nacos.plugin.datasource.db.num=${MYSQL_DATABASE_NUM:1}
nacos.plugin.datasource.db.url.0=jdbc:mysql://${MYSQL_SERVICE_HOST:}:${MYSQL_SERVICE_PORT:3306}/${MYSQL_SERVICE_DB_NAME:}?${MYSQL_SERVICE_DB_PARAM:characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false}
nacos.plugin.datasource.db.user.0=${MYSQL_SERVICE_USER:}
nacos.plugin.datasource.db.password.0=${MYSQL_SERVICE_PASSWORD:}
nacos.plugin.datasource.db.pool.config.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
nacos.plugin.datasource.db.pool.config.validation-timeout=10000
nacos.plugin.datasource.db.pool.config.maximum-pool-size=20
nacos.plugin.datasource.db.pool.config.minimum-idle=2

### For PostgreSQL, build the archive for postgresql, pass NACOS_NATIVE_DATASOURCE=postgresql to the build,
### and mount a copy of this file in which these lines replace the MySQL URL above:
#nacos.plugin.datasource-dialect.type=postgresql
#nacos.plugin.datasource.db.url.0=jdbc:postgresql://127.0.0.1:5432/nacos
#nacos.plugin.datasource.db.user.0=nacos
#nacos.plugin.datasource.db.password.0=nacos
#nacos.plugin.datasource.db.pool.config.driver-class-name=org.postgresql.Driver

#*************** Metrics Related Configurations ***************#
management.endpoints.web.exposure.include=prometheus

#*************** Naming Module Related Configurations ***************#
nacos.naming.data.warmup=true
nacos.naming.empty-service.auto-clean=true
nacos.naming.empty-service.clean.initial-delay-ms=50000
nacos.naming.empty-service.clean.period-time-ms=30000

#*************** Optional DNS Service Discovery ***************#
nacos.naming.dns.enabled=${NACOS_NAMING_DNS_ENABLED:false}
nacos.naming.dns.port=${NACOS_NAMING_DNS_PORT:5353}
nacos.naming.dns.bind-address=${NACOS_NAMING_DNS_BIND_ADDRESS:127.0.0.1}

#*************** AI Features ***************#
### The archive contains no AI plugin. The Server checks the registry switches and AI resource search against
### the values the archive was built with, which are the defaults below. A different value of the first four
### keys, such as NACOS_AI_REGISTRY_ENABLED=true, makes the Server refuse to start. The pipeline and resource
### import switches are not checked.
nacos.ai.mcp.registry.enabled=${NACOS_AI_REGISTRY_ENABLED:false}
nacos.ai.skill.registry.enabled=${NACOS_AI_SKILL_REGISTRY_ENABLED:false}
nacos.ai.ard.enabled=${NACOS_AI_ARD_ENABLED:false}
nacos.ai.resource.search.enabled=${NACOS_AI_RESOURCE_SEARCH_ENABLED:true}
nacos.plugin.ai-pipeline.enabled=${NACOS_AI_PIPELINE_ENABLED:true}
nacos.plugin.ai-resource-import.enabled=${NACOS_AI_RESOURCE_IMPORT_ENABLED:true}

#*************** Istio and Kubernetes Related Configurations ***************#
nacos.istio.mcp.server.enabled=false
nacos.k8s.sync.enabled=false

#--------------- Nacos Web Server Configurations ---------------#

#*************** Nacos Web Server Related Configurations ***************#
### Nacos Server Web context path:
nacos.server.contextPath=${SERVER_SERVLET_CONTEXTPATH:/nacos}

#*************** Access Log Related Configurations ***************#
server.tomcat.accesslog.enabled=${TOMCAT_ACCESSLOG_ENABLED:false}
server.tomcat.basedir=file:.

#*************** API Related Configurations ***************#
server.error.include-message=ALWAYS

#--------------- Nacos Console Configurations ---------------#

#*************** Nacos Console Related Configurations ***************#
### Nacos Console Main port, served by the same process in the merged deployment
nacos.console.port=${NACOS_CONSOLE_PORT:8080}
nacos.console.contextPath=${NACOS_CONSOLE_CONTEXTPATH:}

#************** Console UI Configuration ***************#
nacos.console.ui.enabled=${NACOS_CONSOLE_UI_ENABLED:true}
nacos.console.ui.default=${NACOS_CONSOLE_UI_DEFAULT:next}

#*************** Auth Plugin Related Configurations ***************#
### The ignore urls of auth, will be deprecated in the future:
nacos.security.ignore.urls=${NACOS_SECURITY_IGNORE_URLS:/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/next/**,/legacy/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**}

### The auth plugin of the Native archive is the default Nacos auth plugin.
nacos.plugin.auth.type=nacos

### If turn on auth system:
nacos.core.auth.enabled=true
nacos.core.auth.admin.enabled=true
nacos.core.auth.console.enabled=true

### The two properties is the white list for auth and used by identity the request from other server.
nacos.core.auth.server.identity.key=${NACOS_AUTH_IDENTITY_KEY:}
nacos.core.auth.server.identity.value=${NACOS_AUTH_IDENTITY_VALUE:}

### Turn on/off caching of auth information. Updates may have a 15-second delay when enabled.
nacos.plugin.auth.nacos.caching.enabled=${NACOS_AUTH_CACHE_ENABLE:false}
### Enable token parse and validation cache:
nacos.plugin.auth.nacos.token.cache.enable=false
### The token expiration in seconds:
nacos.plugin.auth.nacos.token.expire.seconds=${NACOS_AUTH_TOKEN_EXPIRE_SECONDS:18000}
### The entrypoint requires NACOS_AUTH_TOKEN; use a unique Base64 secret.
nacos.plugin.auth.nacos.token.secret.key=${NACOS_AUTH_TOKEN:}
### Allow anonymous read access to AI resources. AI resources are off in this image.
nacos.plugin.auth.nacos.anonymous.ai.enabled=false
